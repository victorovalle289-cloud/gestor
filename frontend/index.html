<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <title>Gestor de contraseñas</title>
</head>
<body style="background-color: rgb(75, 153, 204);" class="min-vh-100 d-flex align-items-center justify-content-center">
    <div id="main" class="container">
        <div id="marco" class="container my-5 text-center">
            <h1>Gestor de contraseñas</h1>
            <table class="table table-striped table-hover bg-white rounded shadow-sm">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Plataforma</th>
                        <th scope="col">Usuario</th>
                        <th scope="col">Contraseña</th>
                        <th scope="col">Editar</th>
                        <th scope="col">Eliminar</th>
                    </tr>
                </thead>
                <tbody id="data">
                    <!-- Filas dinámicas generadas desde JS -->
                </tbody>
            </table>
            <div>
                <button type="button" class="btn btn-primary" onclick="location.href='add.html'">
                    <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" height="20" width="20" style="filter: invert(1);"> Agregar
                </button>
            </div>
        </div>
    </div>

    <!-- Cargar app.js al final del body antes de ejecutar la función -->
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            consulta_general();
        });
    </script>
</body>
</html>
